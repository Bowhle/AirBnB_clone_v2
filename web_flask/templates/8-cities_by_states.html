<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cities by States</title>
</head>
<body>
    <h1>States</h1>
    <ul>
        {% for state_and_city in states_and_cities %}
            <li>
                <strong>{{ state_and_city.state.id }}: {{ state_and_city.state.name }}</strong>
                <ul>
                    {% for city in state_and_city.cities %}
                        <li>{{ city.id }}: <b>{{ city.name }}</b></li>
                    {% endfor %}
                </ul>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
